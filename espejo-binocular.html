<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espejo Binocular PRO | Centro Perceptum</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --rojo-fondo: #80322a; --rojo-fig: #69302a;
            --verde-fondo: #69913d; --verde-fig: #6c7b5a;
            --accent: #fbbf24;
        }

        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background: var(--bg); font-family: 'Montserrat', sans-serif;
            height: 100vh; width: 100vw; color: white;
        }

        /* --- INTERFAZ SUPERIOR (ESTÁTICA, NO TAPA NADA) --- */
        .top-bar {
            height: 80px; background: var(--bg);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 2px solid #333;
        }

        .btn-salir {
            background: #ef4444; color: white; border: none; padding: 10px 20px;
            font-weight: 900; border-radius: 5px; cursor: pointer; text-transform: uppercase;
        }

        .search-target {
            background: var(--accent); color: black; padding: 5px 25px;
            border-radius: 10px; border: 3px solid #000; text-align: center;
        }

        .stats-box {
            background: #1e293b; border: 1px solid var(--accent);
            padding: 8px 15px; border-radius: 30px; display: flex; gap: 15px; font-size: 0.8rem;
        }

        /* --- BARRA DE TIEMPO --- */
        .timer-container {
            width: 100%; height: 8px; background: #222; position: relative;
        }
        #timer-bar {
            width: 100%; height: 100%; background: var(--accent); transition: width 0.1s linear;
        }

        /* --- ÁREA DE JUEGO (RESERVADA) --- */
        #game-container {
            height: calc(100vh - 88px); /* Resta la barra superior y la de tiempo */
            width: 100vw; background: #ca8a04;
            display: grid; gap: 2px; padding: 2px; box-sizing: border-box;
        }

        .cell {
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: transform 0.1s;
        }
        .cell:active { transform: scale(0.95); }

        .fig { font-size: 2.2rem; font-weight: 900; user-select: none; pointer-events: none; }

        .c-rojo { background-color: var(--rojo-fondo); color: var(--rojo-fig); }
        .c-verde { background-color: var(--verde-fondo); color: var(--verde-fig); }

        /* --- PANTALLAS --- */
        .overlay-screen {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .btn-menu {
            background: var(--accent); color: black; border: none; padding: 15px 40px;
            font-size: 1.2rem; font-weight: 900; border-radius: 50px; cursor: pointer; margin: 10px;
        }

        .hidden { display: none !important; }

        @keyframes pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(4); } }
        .seq-active { animation: pulse 0.6s ease; }
    </style>
</head>
<body>

    <!-- Introducción Original -->
    <div id="intro" class="overlay-screen">
        <h1 style="color: var(--accent); font-size: 2.5rem;">ESPEJO BINOCULAR PRO</h1>
        <p>Selecciona modalidad de trabajo:</p>
        <button class="btn-menu" onclick="init('libre')">MODO LIBRE</button>
        <button class="btn-menu" onclick="init('tiempo')">CONTRARELOJ</button>
        <button class="btn-menu" style="background: #666; color: white;" onclick="window.location.href='index.html'">VOLVER AL MENÚ</button>
    </div>

    <!-- UI Superior -->
    <div class="top-bar">
        <button class="btn-salir" onclick="location.reload()">SALIR</button>
        
        <div class="search-target">
            <small style="display:block; font-size: 0.6rem; font-weight: 900;">BUSCAR:</small>
            <span id="target-val" style="font-size: 1.8rem; font-weight: 900;">-</span>
        </div>

        <div class="stats-box">
            <span>NVL: <b id="nvl-txt">1</b></span>
            <span>PTS: <b id="pts-txt">0</b></span>
            <span style="color: #f87171;">VIDAS: <b id="vds-txt">♥♥♥</b></span>
        </div>
    </div>
    
    <div class="timer-container" id="t-cont">
        <div id="timer-bar"></div>
    </div>

    <div id="game-container"></div>

    <script>
        const symbols = ['Σ','Ω','Ψ','Φ','Θ','Δ','Ξ','Π','A','B','C','D','E','F','G','H','J','K','L','M','N','P','Q','R','S','T','U','V','W','X','Y','Z','1','2','3','4','5','6','7','8','9','★','◆','●','▲','■','✖','♣','♠','♥','♦'];
        let nvl = 1, pts = 0, vds = 3, targetSeq = [], userPos = 0, mode = 'libre', isLocked = false;
        let timeLeft = 100, timerInt;

        const audio = new (window.AudioContext || window.webkitAudioContext)();
        function beep(f, t) {
            const o = audio.createOscillator(); const g = audio.createGain();
            o.connect(g); g.connect(audio.destination); o.type = t; o.frequency.value = f;
            g.gain.setValueAtTime(0.1, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.2);
            o.start(); o.stop(audio.currentTime + 0.2);
        }

        function init(m) {
            mode = m;
            document.getElementById('intro').classList.add('hidden');
            if(mode === 'libre') document.getElementById('t-cont').classList.add('hidden');
            render();
        }

        function render() {
            const container = document.getElementById('game-container');
            const cols = 14;
            const rows = Math.floor(container.clientHeight / (container.clientWidth / cols));
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            container.innerHTML = '';

            const cells = [];
            for (let i = 0; i < cols * rows; i++) {
                const cell = document.createElement('div');
                const fig = symbols[Math.floor(Math.random() * symbols.length)];
                const isRed = (Math.floor(i / cols) + i) % 2 === 0;

                cell.className = `cell ${isRed ? 'c-rojo' : 'c-verde'}`;
                cell.innerHTML = `<span class="fig">${fig}</span>`;
                cell.dataset.fig = fig;
                cell.onclick = (e) => { e.stopPropagation(); check(cell); };
                
                container.appendChild(cell);
                cells.push(cell);
            }

            // Selección de objetivos
            const count = nvl >= 3 ? Math.min(nvl - 1, 5) : 1;
            targetSeq = [];
            const copy = [...cells];
            for(let i=0; i<count; i++) {
                targetSeq.push(copy.splice(Math.floor(Math.random()*copy.length), 1)[0]);
            }

            if(count > 1) playSeq();
            else setTarget(targetSeq[0]);

            if(mode === 'tiempo') resetTimer();
        }

        async function playSeq() {
            isLocked = true;
            document.getElementById('target-val').innerText = "?";
            await new Promise(r => setTimeout(r, 800));
            for(let c of targetSeq) {
                c.classList.add('seq-active');
                beep(800, 'sine');
                await new Promise(r => setTimeout(r, 600));
                c.classList.remove('seq-active');
                await new Promise(r => setTimeout(r, 200));
            }
            isLocked = false;
        }

        function setTarget(c) {
            const display = document.getElementById('target-val');
            display.innerText = c.dataset.fig;
            display.style.color = c.classList.contains('c-rojo') ? 'var(--rojo-fig)' : 'var(--verde-fig)';
        }

        function check(cell) {
            if(isLocked) return;

            if (cell === targetSeq[userPos]) {
                beep(1200, 'sine');
                cell.style.visibility = "hidden";
                userPos++;
                if (userPos === targetSeq.length) {
                    pts += targetSeq.length;
                    if(pts % 5 === 0) nvl++;
                    userPos = 0;
                    updateUI();
                    setTimeout(render, 200);
                }
            } else {
                beep(200, 'square');
                vds--;
                updateUI();
                if(vds <= 0) over();
            }
        }

        function resetTimer() {
            clearInterval(timerInt);
            timeLeft = 100;
            timerInt = setInterval(() => {
                timeLeft -= 0.5;
                document.getElementById('timer-bar').style.width = timeLeft + "%";
                if(timeLeft <= 0) over();
            }, 100);
        }

        function updateUI() {
            document.getElementById('nvl-txt').innerText = nvl;
            document.getElementById('pts-txt').innerText = pts;
            document.getElementById('vds-txt').innerText = "♥".repeat(vds);
        }

        function over() {
            clearInterval(timerInt);
            alert(`FIN DE SESIÓN\nPuntos: ${pts}\nNivel: ${nvl}`);
            location.reload();
        }

        window.onresize = () => { if(document.getElementById('intro').classList.contains('hidden')) render(); };
    </script>
</body>
</html>

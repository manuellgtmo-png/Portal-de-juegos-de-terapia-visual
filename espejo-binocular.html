<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espejo Binocular PRO - Perceptum</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            /* Colores ajustados para filtrado anaglifo real */
            --rojo-base: #7f1d1d; /* Rojo oscuro para la caja */
            --rojo-figura: rgba(0, 0, 0, 0.3); /* Figura interna oscurecida */
            --verde-base: #166534; /* Verde oscuro para la caja */
            --verde-figura: rgba(0, 0, 0, 0.3); 
            --ui-blue: #38bdf8;
        }

        body {
            margin: 0; font-family: 'Montserrat', sans-serif;
            background-color: var(--bg); color: white;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- INTERFAZ --- */
        .header-ui {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: #1e293b; border-bottom: 2px solid #10b981;
        }

        .btn-salir {
            background: #334155; border: none; color: white;
            padding: 5px 15px; border-radius: 5px; cursor: pointer;
            text-transform: uppercase; font-weight: 900; font-size: 0.7rem;
        }

        .stats { display: flex; gap: 20px; font-weight: 900; font-size: 0.9rem; }
        .stat-val { color: var(--ui-blue); }

        /* --- MENÚ --- */
        #menu-inicio {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; text-align: center;
        }

        .titulo { font-size: 2rem; margin-bottom: 20px; font-weight: 900; }
        .titulo span:first-child { color: #ef4444; }
        .titulo span:last-child { color: #22c55e; }

        .btn-modo {
            background: #1e293b; border: 2px solid white; color: white;
            padding: 15px 30px; border-radius: 10px; margin: 10px;
            cursor: pointer; font-weight: 700; width: 250px;
        }

        /* --- JUEGO --- */
        #game-area {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 30px;
        }

        .instruccion { color: #fbbf24; font-weight: 900; letter-spacing: 1px; }

        .caja {
            width: 90px; height: 90px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer;
        }

        /* La figura interna tiene baja opacidad para el efecto de filtrado */
        .figura-interna {
            font-size: 3rem;
            opacity: 0.4; 
            color: black; /* El negro sobre el color base ayuda al filtrado anaglifo */
        }

        .rojo { background-color: var(--rojo-base); }
        .verde { background-color: var(--verde-base); }

        .grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
        }

    </style>
</head>
<body>

    <div id="menu-inicio">
        <h1 class="titulo"><span>ESPEJO</span> <span>BINOCULAR</span></h1>
        <p>USA GAFAS ROJO/VERDE. DISTANCIA: 40 CM.</p>
        <button class="btn-modo" onclick="iniciar('libre')">MODO LIBRE</button>
        <button class="btn-modo" onclick="iniciar('tiempo')">CONTRARELOJ (60S)</button>
        <a href="index.html" style="color: gray; margin-top: 20px; text-decoration: none;">VOLVER AL PORTAL</a>
    </div>

    <div class="header-ui">
        <button onclick="location.reload()" class="btn-salir">← SALIR</button>
        <div class="stats">
            <span>NIVEL: <span id="l-nivel" class="stat-val">1</span></span>
            <span>TIEMPO: <span id="l-tiempo" class="stat-val">00:00</span></span>
            <span>ACIERTOS: <span id="l-puntos" class="stat-val">0</span></span>
        </div>
    </div>

    <div id="game-area">
        <div class="instruccion">BUSCA ESTO:</div>
        <div id="objetivo" class="caja rojo">
            <span class="figura-interna">▲</span>
        </div>

        <div class="grid" id="opciones">
            <!-- Dinámico -->
        </div>
    </div>

    <script>
        let puntos = 0;
        let nivel = 1;
        let seg = 0;
        let modoActual = '';
        const figuras = ['▲', '■', '●', '★', '♥'];

        function iniciar(m) {
            modoActual = m;
            document.getElementById('menu-inicio').style.display = 'none';
            if(m === 'tiempo') seg = 60;
            setInterval(tick, 1000);
            nuevoNivel();
        }

        function tick() {
            if(modoActual === 'tiempo') {
                seg--;
                if(seg <= 0) { alert("Fin del tiempo!"); location.reload(); }
            } else {
                seg++;
            }
            let min = Math.floor(Math.abs(seg)/60);
            let s = Math.abs(seg)%60;
            document.getElementById('l-tiempo').innerText = `${min}:${s < 10 ? '0'+s : s}`;
        }

        function nuevoNivel() {
            const container = document.getElementById('opciones');
            container.innerHTML = '';
            
            const figCorrecta = figuras[Math.floor(Math.random()*figuras.length)];
            const colorGuia = Math.random() > 0.5 ? 'rojo' : 'verde';
            
            const obj = document.getElementById('objetivo');
            obj.className = `caja ${colorGuia}`;
            obj.innerHTML = `<span class="figura-interna">${figCorrecta}</span>`;

            let opciones = [figCorrecta];
            while(opciones.length < 4) {
                let f = figuras[Math.floor(Math.random()*figuras.length)];
                if(!opciones.includes(f)) opciones.push(f);
            }
            opciones.sort(() => Math.random() - 0.5);

            opciones.forEach(f => {
                const colorOpcion = colorGuia === 'rojo' ? 'verde' : 'rojo';
                const div = document.createElement('div');
                div.className = `caja ${colorOpcion}`;
                div.innerHTML = `<span class="figura-interna">${f}</span>`;
                div.onclick = () => {
                    if(f === figCorrecta) {
                        puntos++;
                        if(puntos % 5 === 0) nivel++;
                        document.getElementById('l-puntos').innerText = puntos;
                        document.getElementById('l-nivel').innerText = nivel;
                        nuevoNivel();
                    }
                };
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>

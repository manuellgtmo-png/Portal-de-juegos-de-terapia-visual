<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espejo Binocular - Perceptum</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --rojo-fondo: #80322a; --rojo-figura: #69302a;
            --verde-fondo: #69913d; --verde-figura: #6c7b5a;
            --ui-blue: #38bdf8; --ui-green: #10b981;
        }

        body {
            margin: 0; font-family: 'Montserrat', sans-serif;
            background-color: var(--bg); color: white;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- UI HEADER --- */
        .header-ui {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 25px; background: #1e293b; border-bottom: 3px solid var(--ui-green);
        }

        .btn-salir-game {
            background: #ef4444; border: none; color: white; padding: 8px 15px;
            border-radius: 6px; cursor: pointer; font-weight: 900; font-size: 0.75rem;
            transition: 0.3s;
        }
        .btn-salir-game:hover { background: #b91c1c; transform: scale(1.05); }

        .stats-group { display: flex; gap: 30px; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.6rem; color: var(--ui-blue); font-weight: 900; text-transform: uppercase; }
        .stat-num { font-size: 1.1rem; font-weight: 900; display: block; }
        .vidas-color { color: #f43f5e; }

        /* --- INTRO Y MENÚ --- */
        #menu-inicio {
            position: fixed; inset: 0; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }

        .logo-main { font-size: 3rem; font-weight: 900; margin-bottom: 5px; }
        .logo-main .r { color: var(--rojo-fondo); } .logo-main .v { color: var(--verde-fondo); }

        .instructions-card {
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px;
            margin-bottom: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }

        .slider-container { margin: 20px 0; width: 280px; text-align: center; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--ui-green); }

        .btn-play-big {
            background: var(--ui-green); border: none; color: white;
            padding: 15px 40px; border-radius: 50px; cursor: pointer;
            font-weight: 900; font-size: 1.2rem; transition: 0.3s; width: 280px; margin: 5px;
        }
        .btn-play-big.alt { background: transparent; border: 2px solid white; }
        .btn-play-big:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        /* --- GAMEPLAY --- */
        #game-area { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }

        .target-tag { 
            background: #fbbf24; color: black; padding: 4px 15px; border-radius: 5px;
            font-weight: 900; font-size: 0.8rem; margin-bottom: 10px;
        }

        .caja-base {
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3); line-height: 0;
        }
        .caja-main { width: 130px; height: 130px; }
        .caja-opt { width: 100px; height: 100px; cursor: pointer; transition: 0.2s; }
        .caja-opt:hover { transform: scale(1.05); }

        .fig-icon { font-size: 4rem; pointer-events: none; }
        .grid-dynamic { display: grid; gap: 20px; justify-items: center; }

        .bg-r { background-color: var(--rojo-fondo); } .fg-r { color: var(--rojo-figura); }
        .bg-v { background-color: var(--verde-fondo); } .fg-v { color: var(--verde-figura); }

        /* Animación para niveles altos */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .anim-float { animation: float 3s ease-in-out infinite; }

    </style>
</head>
<body>

    <div id="menu-inicio">
        <div class="logo-main"><span class="r">ESPEJO</span> <span class="v">BINOCULAR</span></div>
        <div class="instructions-card">
            <p>🕶️ Usa gafas <b>Rojo/Verde</b></p>
            <p>📏 Distancia: <b>40 cm</b></p>
            <p>🎯 Busca la figura que falta para completar la pareja.</p>
        </div>

        <div class="slider-container" id="slider-box" style="display:none;">
            <label class="stat-label">TIEMPO: <span id="time-display">30</span>s</label><br>
            <input type="range" id="time-slider" min="5" max="60" value="30" oninput="updateTimeVal(this.value)">
        </div>

        <button class="btn-play-big" onclick="setupTimer()">MODO CONTRARELOJ</button>
        <button class="btn-play-big alt" onclick="start('libre')">MODO LIBRE</button>
        <a href="index.html" style="margin-top:20px; color: #64748b; text-decoration:none; font-size:0.9rem;">← VOLVER AL PORTAL</a>
    </div>

    <div class="header-ui">
        <button onclick="location.reload()" class="btn-salir-game">SALIR</button>
        <div class="stats-group">
            <div class="stat-box"><span class="stat-label">Nivel</span><span class="stat-num" id="u-nivel">1</span></div>
            <div class="stat-box"><span class="stat-label">Tiempo</span><span class="stat-num" id="u-tiempo">00:00</span></div>
            <div class="stat-box"><span class="stat-label">Vidas</span><span class="stat-num vidas-color" id="u-vidas">♥♥♥</span></div>
            <div class="stat-box"><span class="stat-label">Aciertos</span><span class="stat-num" id="u-puntos">0</span></div>
        </div>
    </div>

    <div id="game-area">
        <div class="target-tag">BUSCA ESTA FIGURA:</div>
        <div id="target" class="caja-base caja-main bg-r"></div>
        <div id="grid" class="grid-dynamic"></div>
    </div>

    <script>
        let pts = 0, vds = 3, nvl = 1, t = 0, m = '', loop;
        const figs = ['▲', '■', '●', '★', '✖', '♦', '♣'];

        function updateTimeVal(v) { document.getElementById('time-display').innerText = v; t = parseInt(v); }

        function setupTimer() {
            document.getElementById('slider-box').style.display = 'block';
            const btn = document.querySelector('.btn-play-big');
            btn.innerText = "¡EMPEZAR AHORA!";
            btn.onclick = () => start('timer');
        }

        function start(modo) {
            m = modo;
            document.getElementById('menu-inicio').style.display = 'none';
            if(m === 'libre') t = 0;
            else if(t === 0) t = 30; // Default si no movió slider
            loop = setInterval(tick, 1000);
            draw();
        }

        function tick() {
            if(m === 'timer') { t--; if(t <= 0) end("TIEMPO AGOTADO"); }
            else t++;
            let min = Math.floor(Math.abs(t)/60), seg = Math.abs(t)%60;
            document.getElementById('u-tiempo').innerText = `${min}:${seg<10?'0':''}${seg}`;
        }

        function draw() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            // Dificultad por nivel
            let cant = nvl < 4 ? 4 : (nvl < 7 ? 6 : 8);
            grid.style.gridTemplateColumns = `repeat(${cant > 4 ? 3 : 2}, 1fr)`;

            const correct = figs[Math.floor(Math.random()*figs.length)];
            const isRed = Math.random() > 0.5;
            
            const target = document.getElementById('target');
            target.className = `caja-base caja-main ${isRed?'bg-r':'bg-v'}`;
            target.innerHTML = `<span class="fig-icon ${isRed?'fg-r':'fg-v'}">${correct}</span>`;

            let opts = [correct];
            while(opts.length < cant) {
                let f = figs[Math.floor(Math.random()*figs.length)];
                if(!opts.includes(f)) opts.push(f);
            }
            opts.sort(() => Math.random() - 0.5);

            opts.forEach(f => {
                const div = document.createElement('div');
                const col = !isRed ? 'r' : 'v';
                div.className = `caja-base caja-opt bg-${col} ${nvl >= 7 ? 'anim-float' : ''}`;
                div.innerHTML = `<span class="fig-icon fg-${col}">${f}</span>`;
                div.onclick = () => {
                    if(f === correct) {
                        pts++; if(pts%5===0) nvl++;
                        updateUI(); draw();
                    } else {
                        vds--; updateUI();
                        if(vds<=0) end("SIN VIDAS");
                        document.body.style.background = "#450a0a";
                        setTimeout(() => document.body.style.background = "var(--bg)", 150);
                    }
                };
                grid.appendChild(div);
            });
        }

        function updateUI() {
            document.getElementById('u-puntos').innerText = pts;
            document.getElementById('u-nivel').innerText = nvl;
            document.getElementById('u-vidas').innerText = "♥".repeat(vds);
        }

        function end(txt) {
            clearInterval(loop);
            alert(`${txt}\nAciertos: ${pts} | Nivel: ${nvl}`);
            location.reload();
        }
    </script>
</body>
</html>

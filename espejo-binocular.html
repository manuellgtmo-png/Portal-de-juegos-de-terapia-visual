<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espejo Binocular PRO - Perceptum</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            /* Tus códigos exactos */
            --rojo-fondo: #80322a;
            --rojo-figura: #69302a;
            --verde-fondo: #69913d;
            --verde-figura: #6c7b5a;
            --ui-blue: #38bdf8;
            --ui-green: #10b981;
        }

        body {
            margin: 0; font-family: 'Montserrat', sans-serif;
            background-color: var(--bg); color: white;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- UI HEADER (Estilo Pro) --- */
        .header-ui {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: #1e293b; border-bottom: 3px solid var(--ui-green);
        }

        .btn-salir-game {
            background: #334155; border: 2px solid var(--ui-blue); color: white;
            padding: 8px 18px; border-radius: 10px; cursor: pointer;
            font-weight: 900; font-size: 0.8rem; text-transform: uppercase;
        }

        .stats-group { display: flex; gap: 40px; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.65rem; color: var(--ui-blue); display: block; margin-bottom: 2px; }
        .stat-num { font-size: 1.2rem; font-weight: 900; }
        .vidas-icon { color: #ef4444; font-size: 1.4rem; letter-spacing: 3px; }

        /* --- MENÚ DE ENTRADA --- */
        #menu-inicio {
            position: fixed; inset: 0; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
        }

        .logo-game { font-size: 3.5rem; font-weight: 900; margin-bottom: 10px; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .logo-game span:first-child { color: var(--rojo-fondo); }
        .logo-game span:last-child { color: var(--verde-fondo); }

        .btn-play {
            background: none; border: 2px solid white; color: white;
            padding: 18px 40px; border-radius: 50px; margin: 12px;
            cursor: pointer; font-weight: 900; font-size: 1.1rem; width: 280px;
            transition: all 0.3s;
        }
        .btn-play:hover { background: white; color: var(--bg); transform: scale(1.05); }

        /* --- ESCENARIO DE JUEGO --- */
        #game-area {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: space-evenly; padding: 20px;
        }

        .instruction-tag { 
            background: #fbbf24; color: #000; padding: 5px 20px; 
            border-radius: 20px; font-weight: 900; font-size: 0.9rem;
        }

        /* Figuras GRANDES */
        .caja-grande {
            width: 140px; height: 140px; border-radius: 25px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .caja-opcion {
            width: 120px; height: 120px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .caja-opcion:active { transform: scale(0.9); }

        .figura-simbolo { font-size: 5rem; } /* Símbolo gigante para ocupar el espacio */

        /* Colores exactos del usuario */
        .bg-rojo { background-color: #80322a; }
        .fg-rojo { color: #69302a; }
        .bg-verde { background-color: #69913d; }
        .fg-verde { color: #6c7b5a; }

        .grid-opciones {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px;
        }

    </style>
</head>
<body>

    <div id="menu-inicio">
        <div class="logo-game"><span>ESPEJO</span> <span>BINOCULAR</span></div>
        <p style="letter-spacing: 2px; font-size: 0.8rem; margin-bottom: 30px;">USA GAFAS ROJO/VERDE | 40 CM</p>
        <button class="btn-play" onclick="empezar('libre')">MODO LIBRE</button>
        <button class="btn-play" onclick="empezar('timer')">CONTRARELOJ (60S)</button>
        <a href="index.html" style="margin-top: 30px; color: #64748b; text-decoration: none; font-weight: 700;">SALIR AL PORTAL</a>
    </div>

    <div class="header-ui">
        <button onclick="location.reload()" class="btn-salir-game">← SALIR</button>
        <div class="stats-group">
            <div class="stat-box"><span class="stat-label">NIVEL</span><span class="stat-num" id="ui-nivel">1</span></div>
            <div class="stat-box"><span class="stat-label">TIEMPO</span><span class="stat-num" id="ui-tiempo">00:00</span></div>
            <div class="stat-box"><span class="stat-label">VIDAS</span><span class="vidas-icon" id="ui-vidas">♥♥♥</span></div>
            <div class="stat-box"><span class="stat-label">ACIERTOS</span><span class="stat-num" id="ui-puntos">0</span></div>
        </div>
    </div>

    <div id="game-area">
        <div class="instruction-tag">BUSCA ESTA FIGURA:</div>
        
        <div id="target-box" class="caja-grande bg-rojo">
            <span class="figura-simbolo fg-rojo">▲</span>
        </div>

        <div class="grid-opciones" id="opciones-container">
            <!-- Se llena con JS -->
        </div>
    </div>

    <script>
        let aciertos = 0;
        let vidas = 3;
        let nivel = 1;
        let tiempo = 0;
        let modo = '';
        const figuras = ['▲', '■', '●', '★', '✖'];

        function empezar(m) {
            modo = m;
            document.getElementById('menu-inicio').style.display = 'none';
            if(m === 'timer') tiempo = 60;
            setInterval(reloj, 1000);
            nuevoNivel();
        }

        function reloj() {
            if(modo === 'timer') {
                tiempo--;
                if(tiempo <= 0) fin("¡TIEMPO AGOTADO!");
            } else {
                tiempo++;
            }
            let min = Math.floor(Math.abs(tiempo)/60);
            let seg = Math.abs(tiempo)%60;
            document.getElementById('ui-tiempo').innerText = `${min}:${seg < 10 ? '0'+seg : seg}`;
        }

        function nuevoNivel() {
            const container = document.getElementById('opciones-container');
            container.innerHTML = '';
            
            const correcta = figuras[Math.floor(Math.random()*figuras.length)];
            const esRojoGuia = Math.random() > 0.5;
            
            // Configurar Objetivo
            const target = document.getElementById('target-box');
            target.className = `caja-grande ${esRojoGuia ? 'bg-rojo' : 'bg-verde'}`;
            target.innerHTML = `<span class="figura-simbolo ${esRojoGuia ? 'fg-rojo' : 'fg-verde'}">${correcta}</span>`;

            // Crear Opciones (Color opuesto para integración)
            let opciones = [correcta];
            while(opciones.length < 4) {
                let f = figuras[Math.floor(Math.random()*figuras.length)];
                if(!opciones.includes(f)) opciones.push(f);
            }
            opciones.sort(() => Math.random() - 0.5);

            opciones.forEach(f => {
                const div = document.createElement('div');
                const colorOpcion = !esRojoGuia ? 'rojo' : 'verde';
                div.className = `caja-opcion bg-${colorOpcion}`;
                div.innerHTML = `<span class="figura-simbolo fg-${colorOpcion}">${f}</span>`;
                div.onclick = () => {
                    if(f === correcta) {
                        aciertos++;
                        if(aciertos % 5 === 0) nivel++;
                        actualizarUI();
                        nuevoNivel();
                    } else {
                        vidas--;
                        actualizarUI();
                        if(vidas <= 0) fin("TE HAS QUEDADO SIN VIDAS");
                        document.body.style.backgroundColor = "#450a0a";
                        setTimeout(() => document.body.style.backgroundColor = "var(--bg)", 150);
                    }
                };
                container.appendChild(div);
            });
        }

        function actualizarUI() {
            document.getElementById('ui-puntos').innerText = aciertos;
            document.getElementById('ui-nivel').innerText = nivel;
            document.getElementById('ui-vidas').innerText = "♥".repeat(vidas);
        }

        function fin(msg) {
            alert(`${msg}\nAciertos: ${aciertos} | Nivel: ${nivel}`);
            location.reload();
        }
    </script>
</body>
</html>

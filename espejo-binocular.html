<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espejo Binocular PRO | Centro Perceptum</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --rojo-fondo: #80322a; --rojo-fig: #69302a;
            --verde-fondo: #69913d; --verde-fig: #6c7b5a;
            --accent: #fbbf24;
        }

        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background: var(--bg); font-family: 'Montserrat', sans-serif;
            height: 100vh; width: 100vw; color: white;
        }

        /* --- PANTALLA INICIAL REFORMADA --- */
        .overlay-screen {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; text-align: center;
        }

        .instrucciones {
            max-width: 600px; background: rgba(255,255,255,0.05); padding: 20px;
            border-radius: 15px; margin-bottom: 30px; border: 1px solid #333;
        }

        .slider-container {
            margin: 20px 0; background: #1e293b; padding: 15px; border-radius: 10px; width: 300px;
        }

        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--accent); }

        .btn-menu {
            background: var(--accent); color: black; border: none; padding: 15px 40px;
            font-size: 1.1rem; font-weight: 900; border-radius: 50px; cursor: pointer; margin: 10px;
            min-width: 250px;
        }

        /* --- UI JUEGO --- */
        .top-bar {
            height: 90px; background: var(--bg); display: flex; 
            justify-content: space-between; align-items: center; padding: 0 20px;
        }

        .search-target {
            background: var(--accent); color: black; padding: 5px 25px;
            border-radius: 10px; border: 3px solid #000;
        }

        .timer-line { width: 100%; height: 6px; background: #222; }
        #timer-fill { width: 100%; height: 100%; background: var(--accent); }

        #game-grid {
            height: calc(100vh - 96px); width: 100vw; background: #ca8a04;
            display: grid; gap: 2px; padding: 2px; box-sizing: border-box;
        }

        .cell { display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .fig { font-size: 2.2rem; font-weight: 900; pointer-events: none; }
        .c-rojo { background-color: var(--rojo-fondo); color: var(--rojo-fig); }
        .c-verde { background-color: var(--verde-fondo); color: var(--verde-fig); }
        
        .hidden { display: none !important; }
        .found { visibility: hidden; }
    </style>
</head>
<body>

    <!-- Introducción con Instrucciones y Slider -->
    <div id="intro" class="overlay-screen">
        <h1 style="color: var(--accent); margin-bottom: 10px;">ESPEJO BINOCULAR PRO</h1>
        
        <div class="instrucciones">
            <p><strong>INSTRUCCIONES:</strong> Realice la tarea a una distancia de <strong>40 cm</strong>. 
            Utilice sus filtros anaglifos. Debe encontrar y tocar <strong>todas</strong> las figuras indicadas en el recuadro superior para avanzar.</p>
        </div>

        <div id="setup-contrareloj" class="hidden">
            <div class="slider-container">
                <label>Tiempo de juego: <b id="val-tiempo">30</b>s</label>
                <input type="range" min="5" max="60" value="30" oninput="document.getElementById('val-tiempo').innerText=this.value">
            </div>
        </div>

        <button class="btn-menu" id="btn-libre" onclick="start('libre')">MODO LIBRE</button>
        <button class="btn-menu" id="btn-prep-time" onclick="showTimeSetup()">CONTRARELOJ</button>
        <button class="btn-menu hidden" id="btn-start-time" onclick="start('tiempo')">¡INICIAR AHORA!</button>
        <button class="btn-menu" style="background:#444; color:white;" onclick="window.location.href='index.html'">VOLVER AL MENÚ</button>
    </div>

    <div class="top-bar">
        <button onclick="location.reload()" style="background:#ef4444; color:white; border:none; padding:10px; font-weight:900; border-radius:5px; cursor:pointer;">SALIR</button>
        <div class="search-target">
            <small style="display:block; font-size:0.6rem; font-weight:900;">BUSCAR TODAS:</small>
            <span id="target-fig" style="font-size:2rem; font-weight:900;">-</span>
        </div>
        <div style="background:#1e293b; padding:10px; border-radius:15px; font-size:0.8rem; border:1px solid var(--accent);">
            NVL: <b id="nvl">1</b> | PTS: <b id="pts">0</b> | <span id="vds" style="color:#f87171">♥♥♥</span>
        </div>
    </div>
    <div class="timer-line"><div id="timer-fill"></div></div>
    <div id="game-grid"></div>

    <script>
        const symbols = ['Σ','Ω','Ψ','Φ','Θ','Δ','Ξ','Π','A','B','C','D','E','F','G','H','J','K','L','M','N','P','Q','R','S','T','U','V','W','X','Y','Z','1','2','3','4','5','6','7','8','9','★','◆','●','▲','■','✖','♣','♠','♥','♦'];
        let nvl=1, pts=0, vds=3, mode='libre', timeTotal=30, timeLeft=30, timer;
        let currentTargetFig = '';
        let targetsRemaining = 0;

        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        function play(f, t) {
            const o=ctx.createOscillator(), g=ctx.createGain();
            o.connect(g); g.connect(ctx.destination); o.type=t; o.frequency.value=f;
            g.gain.setValueAtTime(0.1, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.2);
            o.start(); o.stop(ctx.currentTime+0.2);
        }

        function showTimeSetup() {
            document.getElementById('setup-contrareloj').classList.remove('hidden');
            document.getElementById('btn-libre').classList.add('hidden');
            document.getElementById('btn-prep-time').classList.add('hidden');
            document.getElementById('btn-start-time').classList.remove('hidden');
        }

        function start(m) {
            mode = m;
            timeTotal = parseInt(document.querySelector('input[type=range]').value);
            document.getElementById('intro').classList.add('hidden');
            if(mode === 'libre') document.querySelector('.timer-line').classList.add('hidden');
            render();
        }

        function render() {
            const grid = document.getElementById('game-grid');
            const cols = 14;
            const rows = Math.floor(grid.clientHeight / (grid.clientWidth / cols));
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.innerHTML = '';

            // Elegir figura objetivo primero
            currentTargetFig = symbols[Math.floor(Math.random()*symbols.length)];
            targetsRemaining = 0;

            for (let i = 0; i < cols * rows; i++) {
                const cell = document.createElement('div');
                const isRed = (Math.floor(i / cols) + i) % 2 === 0;
                
                // Probabilidad de que aparezca la figura objetivo (mínimo 2-4 veces)
                let fig = symbols[Math.floor(Math.random()*symbols.length)];
                if(Math.random() < 0.08) fig = currentTargetFig;
                
                if(fig === currentTargetFig) targetsRemaining++;

                cell.className = `cell ${isRed ? 'c-rojo' : 'c-verde'}`;
                cell.innerHTML = `<span class="fig">${fig}</span>`;
                cell.dataset.fig = fig;
                cell.onclick = () => checkCell(cell);
                grid.appendChild(cell);
            }

            // Asegurar que al menos haya una
            if(targetsRemaining === 0) render(); 

            const disp = document.getElementById('target-fig');
            disp.innerText = currentTargetFig;
            
            if(mode === 'tiempo') resetClock();
        }

        function checkCell(cell) {
            if (cell.dataset.fig === currentTargetFig) {
                if(!cell.classList.contains('found')) {
                    play(1000, 'sine');
                    cell.classList.add('found');
                    targetsRemaining--;
                    if(targetsRemaining <= 0) {
                        pts++;
                        if(pts % 3 === 0) nvl++;
                        updateUI();
                        setTimeout(render, 200);
                    }
                }
            } else {
                play(200, 'square');
                vds--;
                updateUI();
                if(vds <= 0) end();
            }
        }

        function resetClock() {
            clearInterval(timer);
            timeLeft = timeTotal;
            timer = setInterval(() => {
                timeLeft -= 0.1;
                document.getElementById('timer-fill').style.width = (timeLeft/timeTotal*100) + "%";
                if(timeLeft <= 0) end();
            }, 100);
        }

        function updateUI() {
            document.getElementById('nvl').innerText = nvl;
            document.getElementById('pts').innerText = pts;
            document.getElementById('vds').innerText = "♥".repeat(vds);
        }

        function end() {
            clearInterval(timer);
            alert(`SESIÓN FINALIZADA\nPuntos: ${pts}\nNivel: ${nvl}`);
            location.reload();
        }
    </script>
</body>
</html>
